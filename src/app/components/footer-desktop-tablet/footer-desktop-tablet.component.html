<footer class="rb-footer bg-rb-cream">
  <div class="shell rb-footer__shell">
    <div class="rb-footer__top">
      <div class="rb-footer__brand">
        <h3 class="brand-font text-5xl text-rb-ink">RespiraBonito</h3>
        <p class="text-rb-plum">Escuela Online RespiraBonito</p>
      </div>

      <nav class="rb-footer__nav" aria-label="Navegación de pie de página">
        <a href="#inicio">Inicio</a>
        <a href="#metodo">Método</a>
        <a href="#dinamicas-viaje">Qué incluye</a>
        <a href="#faq">FAQ</a>
        <a href="https://forms.gle/KxsRE9NDdr3mrPTx6" target="_blank" rel="noopener noreferrer"
          aria-label="Contacto: abrir formulario externo (se abre en una pestaña nueva)">Contacto</a>
      </nav>

      <div class="rb-footer__social">
        <a class="rb-footer__social-link rb-footer__social-link--instagram" [href]="instagramUrl"
          target="_blank" rel="noopener noreferrer"
          aria-label="Instagram de Laurem, @_lauremm (se abre en una pestaña nueva)">
          <app-brand-icon name="instagram" />
        </a>
        <a class="rb-footer__social-link rb-footer__social-link--whatsapp" [href]="whatsappUrl"
          target="_blank" rel="noopener noreferrer"
          aria-label="Unirse al grupo de WhatsApp de RespiraBonito (se abre en una pestaña nueva)">
          <app-brand-icon name="whatsapp" />
        </a>
      </div>
    </div>

    <span class="rb-footer__divider" aria-hidden="true"></span>

    <p class="rb-footer__legal">© {{ year }} RespiraBonito. Todos los derechos reservados.</p>
  </div>

  <div class="rb-float-stack">
    <a class="rb-ig-float" [href]="instagramUrl" target="_blank" rel="noopener noreferrer"
      aria-label="Instagram de Laurem, @_lauremm (se abre en una pestaña nueva)">
      <app-brand-icon name="instagram" />
      <span>Síguenos</span>
    </a>
    <a class="rb-wa-float" [href]="whatsappUrl" target="_blank" rel="noopener noreferrer"
      aria-label="Únete al grupo de WhatsApp de RespiraBonito (se abre en una pestaña nueva)">
      <app-brand-icon name="whatsapp" />
      <span>Únete al grupo</span>
    </a>
  </div>
</footer>
