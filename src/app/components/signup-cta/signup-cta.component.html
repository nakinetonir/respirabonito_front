<div class="rb-signup-cta-wrap" [class.rb-signup-cta-wrap--media]="hasBackgroundMedia">
  @if (bgImageBase) {
    <div class="rb-signup-cta__media" aria-hidden="true">
      <picture>
        <source [srcset]="bgImageBase + '.webp'" type="image/webp">
        <img
          [src]="bgImageBase + '.jpg'"
          alt=""
          class="rb-signup-cta__media-img"
          [style.object-position]="bgPosition"
          decoding="async"
          loading="lazy"
        >
      </picture>
      <div class="rb-signup-cta__media-overlay"></div>
    </div>
  }

  <div class="rb-signup-cta">
    @if (prompt) {
      <p class="rb-signup-cta__prompt">{{ prompt }}</p>
    }

    <div class="rb-signup-cta__illustration" aria-hidden="true">
      <svg viewBox="0 0 560 200" focusable="false">
        <defs>
          <linearGradient [attr.id]="gradientId" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" [attr.stop-color]="colors.start" />
            <stop offset="55%" [attr.stop-color]="colors.mid" />
            <stop offset="100%" [attr.stop-color]="colors.end" />
          </linearGradient>
        </defs>
        <path class="rb-signup-cta__illus-arc" [attr.stroke]="gradientRef" d="M60 126 C 140 76, 220 74, 280 108 S 418 144, 500 92" />
        <path class="rb-signup-cta__illus-arc rb-signup-cta__illus-arc--soft" [attr.stroke]="gradientRef" d="M86 138 C 156 98, 226 94, 282 116 S 408 148, 474 108" />
        <g class="rb-signup-cta__illus-figures" [attr.stroke]="gradientRef">
          <circle cx="178" cy="90" r="11" />
          <path d="M160 126c4-18 15-28 28-28s24 10 28 28" />
          <circle cx="280" cy="78" r="12" />
          <path d="M259 120c5-20 17-32 33-32s29 12 34 32" />
          <circle cx="382" cy="92" r="11" />
          <path d="M364 128c4-17 14-27 28-27s24 10 28 27" />
        </g>
        <path class="rb-signup-cta__illus-lotus" [attr.stroke]="gradientRef" d="M280 168c10-20 24-33 42-41-5 21-15 36-31 47 17-2 33 2 47 12-21 4-39 1-58-11-19 12-37 15-58 11 14-10 30-14 47-12-16-11-26-26-31-47 18 8 32 21 42 41Z" />
      </svg>
    </div>

    <div class="rb-signup-cta__action">
      <a
        class="rb-btn rb-signup-cta__link"
        href="https://forms.gle/KxsRE9NDdr3mrPTx6"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Abrir formulario externo para inscribirse en la Escuela RespiraBonito (se abre en una pestaña nueva)"
      >
        <span>{{ linkText }}</span>
        <mat-icon aria-hidden="true" class="rb-signup-cta__link-icon">open_in_new</mat-icon>
      </a>
    </div>
  </div>
</div>
